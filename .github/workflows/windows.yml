# Windows'ta test eder ve kurulum dosyasını (Raphael-Kurulum-<sürüm>.exe) üretir.
# - Her PR ve main'e her gönderimde: testler, gerçek Windows'ta uçtan uca deneme, kurulum dosyası (Actions'ta indirilebilir).
# - "v" ile başlayan bir etiket gönderilince (ör. v0.2.0): kurulum dosyası GitHub Releases'a yayınlanır;
#   kurulu uygulamalar bu sürümü otomatik güncelleme ile alır.
name: Windows

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Uçtan uca deneme (sahte LoL client, sahte oyun ve sahte Riot API ile)
        run: npm run e2e

      - name: Kurulum dosyası
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --x64 --publish never

      - name: Kurulum dosyasını GitHub Releases'a yayınla
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: Raphael-Windows
          path: |
            release/*.exe
            tests/e2e/output/*.png
          if-no-files-found: ignore
